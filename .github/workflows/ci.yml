name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"

      - name: Make
        run: |
          make jag

      - name: Setup
        run: |
          JAG_BINARY=build/jag
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            JAG_BINARY=build/jag.exe
          fi
          $JAG_BINARY setup --skip-assets
          SDK_PATH="$($JAG_BINARY setup --print-path sdk)"
          ASSETS_PATH="$($JAG_BINARY setup --print-path assets)"
          mkdir -p "$ASSETS_PATH"
          make SDK_PATH="$SDK_PATH" assets
          cp -r build/assets/* "$ASSETS_PATH"

      - name: Run tests
        run: |
          make test

      - name: Install latest Toit QEMU release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          QEMU_VERSION="$(gh release view --repo toitlang/qemu --json tagName --jq .tagName)"
          QEMU_ARCHIVE="qemu-toit-${QEMU_VERSION}-linux-x86_64.tar.gz"
          QEMU_DIR="${RUNNER_TEMP}/toit-qemu"
          mkdir -p "${QEMU_DIR}"
          gh release download "${QEMU_VERSION}" --repo toitlang/qemu \
            --pattern "${QEMU_ARCHIVE}" --pattern SHA256SUMS --dir "${QEMU_DIR}"
          cd "${QEMU_DIR}"
          grep " ${QEMU_ARCHIVE}$" SHA256SUMS | sha256sum --check
          tar -xf "${QEMU_ARCHIVE}"
          echo "QEMU_SYSTEM_XTENSA=${QEMU_DIR}/qemu-toit-${QEMU_VERSION}-linux-x86_64/bin/qemu-system-xtensa" >> "${GITHUB_ENV}"

      - name: Test flashing an ESP32 in QEMU
        if: runner.os == 'Linux'
        run: tests/qemu-flash-test.sh
